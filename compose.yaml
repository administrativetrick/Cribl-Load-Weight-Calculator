services:
  cribl-weight-calculator:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    image: cribl-weight-calculator
    container_name: cribl-weight-calculator
    ports:
      # host:container — set HOST_PORT if 8080 is taken on your host
      # (e.g. HOST_PORT=8081 docker compose up -d)
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
